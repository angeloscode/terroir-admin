name: terroir

services:
  # Весь трафик: Caddy -> Astro-статика + /admin -> Next.js
  app:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost}
    image: terroir-app:local
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-terroir}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-terroir_admin}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      # Только origin, БЕЗ /admin: Auth.js берёт отсюда хост для редиректов,
      # а путь в AUTH_URL переопределил бы его basePath и сломал роутинг /api/auth
      AUTH_URL: ${PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_SITE_URL:-http://localhost}/admin
    volumes:
      - caddy_data:/data # TLS-сертификаты Let's Encrypt
    depends_on:
      db:
        condition: service_healthy

  # БД отдельно: данные в volume, наружу порт не открыт
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terroir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-terroir_admin}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  pg_data:
